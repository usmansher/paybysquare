# Builds the examples/storybook demo and deploys it to GitHub Pages.
# Manual only (workflow_dispatch) so it never publishes on a push; enable
# Pages (Settings → Pages → Source: GitHub Actions) and run it from the
# Actions tab. See examples/storybook/README.md.
name: Storybook Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The demo imports @paybysquare/core via file:, so build it first.
      - name: Build core
        working-directory: packages/core
        run: |
          npm ci
          npm run build
      - name: Build Storybook
        working-directory: examples/storybook
        env:
          SB_BASE: /paybysquare/
        run: |
          npm install
          npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
